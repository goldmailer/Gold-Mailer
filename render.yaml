services:
  - type: web
    name: goldmailer
    env: node
    plan: free
    buildCommand: 'pnpm install --no-frozen-lockfile && pnpm --filter @workspace/db run push && pnpm build'
    startCommand: 'pnpm start'
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        fromDatabase:
          name: goldmailer-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: goldmailer-db
    databaseName: goldmailer
    user: goldmailer
    plan: free
