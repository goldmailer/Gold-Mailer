services:
    - type: web
    name: goldmailer
    env: node
    plan: free
    buildCommand: 'pnpm install --no-frozen-lockfile && pnpm db:push && pnpm build'
    startCommand: 'pnpm start'
    envVars:
            - key: NODE_VERSION
        value: '20'
            - key: DATABASE_URL
        fromDatabase:
          name: goldmailer-db
          property: connectionString

databases:
    - name: goldmailer-db
    databaseName: goldmailer
    user: goldmailer
    plan: free
