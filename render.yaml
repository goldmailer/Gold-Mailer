services:
    - type: web
    name: goldmailer
    env: node
    plan: free
    buildCommand: 'pnpm install --no-frozen-lockfile && cd lib/db && pnpm dlx drizzle-kit push --config=drizzle.config.ts && cd ../.. && pnpm run build'
    startCommand: 'pnpm run start'
    envVars:
            - key: NODE_VERSION
        value: '20'
            - key: DATABASE_URL
        fromDatabase:
          name: goldmailer-db
          property: connectionString

databases:
    - name: goldmailer-db
    databaseName: goldmailer
    user: goldmailer
    plan: free
