services:
    - type: web
    name: goldmailer
    env: node
    plan: free
    buildCommand: 'cd src && pnpm install --no-frozen-lockfile && pnpm dlx drizzle-kit push --config=lib/db/drizzle.config.ts && cd .. && pnpm run build'
    startCommand: 'cd src && pnpm run start'
    envVars:
            - key: NODE_VERSION
        value: '20'
            - key: DATABASE_URL
        fromDatabase:
          name: goldmailer-db
          property: connectionString

databases:
    - name: goldmailer-db
    databaseName: goldmailer
    user: goldmailer
    plan: free
